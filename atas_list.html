<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ªIPB - Udia</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="api.js"></script>
    
    <script>
        const sociedade   = window.sessionStorage.getItem("soc_name");
        
        function populateTable(codigo, mensagem, data) {

            if ( codigo != 0 ) {
                alert(mensagem);
                return;
            }
            data.results.sort((a, b) => {
                const numA = Number(a.numero.substring(3) + a.numero.substring(0, 2));
                const numB = Number(b.numero.substring(3) + b.numero.substring(0, 2));

                return numB - numA;
            });

            obj_l = document.getElementById('LINK_ATAS');
            obj_l.innerHTML = '';

            items  = []
            anoAnt = '-';
            for (i = 0; i < data.results.length; i++) {
                item      = data.results[i];  
                ano       = item.numero.slice(-4);
                lin       = '';
                if ( i > 0 && ano !== anoAnt ) {
                    lin = '<tr><td colspan=2 style="background-color:#FFFFFF"><hr></td></tr>';
                }
                anoAnt = ano;
                
                clauseWhere      = "objectId=" + item.objectId;
                obj_l.innerHTML += `
                    ${lin}
                    <tr>
                        <td><input type=image src=imgs/edit.png onclick="jsAddOrEdit('${item.objectId}')"></td>
                        <td><a href="atas_view.html?${clauseWhere}"> ${item.numero} </a></td>
                    </tr>
                `;
            };
        }
        

        function jsAddOrEdit(nro) {
            window.location.href = 'atas_edit.html?objectId=' + nro;
        }
    </script>

</head>

<body>
    <!-- LISTA DE ATAS PARA EXIBIR -->
    
    <fieldset>
        <legend><input type="button" value="adicionar" onclick="jsAddOrEdit('-')"> || <span id=SOCIEDADE></span></legend>
        <table class="table_rounded">
            <tbody id=LINK_ATAS></tbody>
        </table>
    </fieldset>

    <!-- SCRIPTS DE INIT -->
    
    <script> 
        document.all.SOCIEDADE.innerHTML = sociedade;
        parametros = {
            where: JSON.stringify({
                sociedade: sociedade
            })
        };        
        apiQueryData( url_atas, populateTable, parametros); 
    </script>

    <SPAN id=usuarioLogado></SPAN>
</body>

</html>
